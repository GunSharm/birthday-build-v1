<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Season 28 | Now Streaming</title>
</head>
<body>
    <h1>SEASON 28</h1>
    <p class="tagline">Now streaming: one very good birthday</p>
    <h2>Who's Watching?</h2>
    <button>Skip Intro?</button>
    <div class="button-container">
        <!-- Button 1: Gunjan -->
        <button class="color-btn">
            <span class="color-square ruby"></span>
            <span class="color-name">Gunjan</span>
        </button>

        <!-- Button 2: Guest -->
        <button class="color-btn">
            <span class="color-square emerald"></span>
            <span class="color-name">Guest</span>
        </button>

        <!-- Button 3: Garvit -->
        <button class="color-btn">
            <span class="color-square sapphire"></span>
            <span class="color-name">Garvit</span>
        </button>
    </div>
    <main>Welcome Home</main>
    <button id="toggle-btn">Toggle Secret Message</button>
    <p id="secret-text">This is a hidden message that appears when you click the button!</p>

    <script src="app.js"></script>
</body>
</html>
