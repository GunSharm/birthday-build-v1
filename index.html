<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Season 28 | Now Streaming</title>
</head>
<body>
    <section id="profiles">
        <p class="logo">SEASON 28</p>
        <h2>Who's watching?</h2>
        <div class="button-container">
            <button class="color-btn" id="btn-gunjan">
                <img class="avatar" src="images/gunjan.jpeg" alt="Gunjan">
                <span class="color-name">Gunjan</span>
            </button>

            <button class="color-btn" id="btn-guest">
                <span class="avatar guest-avatar">?</span>
                <span class="color-name">Guest</span>
            </button>

            <button class="color-btn" id="btn-garvit">
                <img class="avatar" src="images/garvit.jpeg" alt="Garvit">
                <span class="color-name">Garvit</span>
            </button> 
            
        </div>
        <button id="ready-btn" hidden>Are you ready, Panda?</button>
        <p id="message"></p>
    </section>
    <main id="home" hidden>
        <header class="topbar">
            <p class="logo-small">SEASON 28</p>
            <img class="topbar-avatar" src="images/garvit.jpeg" alt="Garvit">
        </header>
    
        <section class="hero">
            <h1>The birthday special</h1>
            <p class="tagline">Now streaming: one very good birthday</p>
            <button id="play-btn">Play</button>
        </section>
    
        <h3 class="row-title">Top picks for Garvit</h3>
        <div id="episode-row"></div>
        <h3 class="row-title">Coming soon</h3>
        <div id="locked-row"></div>
    <section id="puzzle" hidden>
        <h2 id="puzzle-title"> WORDLE</h2>
        <p id="puzzle-hint">HINT#1</p>
        <div id="board"></div>
        <input id="guess-input" maxlength="7">
        <button id="guess-btn">GUESS</button>
        <p id="guess-feedback"></p>
        <button id="close-puzzle">BACK TO EPISODES</button>
    </section>
    <section id="connections" hidden>
        <h2 id="connections-title">CONNECTIONS</h2>
        <div class="connections-buttons">
            <button id="shuffle-btn">SHUFFLE</button>
            <button id="hint-btn">HINT</button>
        </div>
        <div id ="solved-groups"></div>
        <div id="connections-board"></div>
        <p id="connections-feedback"></p>
        <button id="submit-btn">SUBMIT</button>
        <button id="close-connections">BACK TO EPISODES</button>
    </section>
    <section id="crossword" hidden>
        <h2 id="crossword-title"></h2>
        <div id="crossword-body">
            <div id="crossword-grid"></div>
            <div id="clue-list"></div>
        </div>
        <p id="crossword-feedback"></p>
        <div id="gold-tiles"></div>
        <div class="connections-buttons">
            <button id="close-crossword">BACK TO EPISODES</button>
        </div>
    </section>
    </main>
    

    <script src="app.js"></script>
</body>
</html>
